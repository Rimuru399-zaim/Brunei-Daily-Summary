name: Build The Brunei Dispatch

on:
  schedule:
    # 06:00 Brunei time (UTC+8, no DST) == 22:00 UTC the previous day.
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Let the job push the rebuilt page and archive back to the repo.
permissions:
  contents: write

concurrency:
  group: dispatch-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Pinned to major versions. GitHub deprecates runner images and action
      # majors roughly yearly — bump these when a run warns or fails (README).
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          READER_NAME: the morning reader
        # No `continue-on-error`: if the build throws, the run goes red and
        # GitHub emails you. We never publish a half-built page (BRIEF §7).
        run: python build.py

      - name: Commit and push the new edition
        run: |
          git config user.name  "dispatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/archive state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Edition: $(date -u +'%Y-%m-%d')"
            git push
          fi
