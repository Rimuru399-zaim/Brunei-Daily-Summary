# The Borneo Dispatch — feed list
#
# Each entry needs a `beat`. Valid beats:
#   brunei  borneo  sea  world  tech
#
# Section mapping (see build.py):
#   "Brunei"                 <- brunei
#   "Southeast Asia"         <- sea
#   "Technology & Business"  <- world + tech
#   the lead + "World in Brief" are chosen across everything
#
# The `borneo` beat was retired 2026-07-31 (paper narrowed to Brunei / SEA /
# World). Leaving a beat: borneo entry here is harmless but unused.
#
# Run `python build.py --check-feeds` before committing changes here.
# A feed that 404s or returns no items should be removed, not left to fail
# every morning. All URLs below were verified live on 2026-07-31.
#
# Dropped after verification (kept here as a record so nobody re-adds them):
#   Daily Express (Sabah)  https://www.dailyexpress.com.my/rss/  -> 403 (blocks
#       automated clients; we do not spoof a browser to get around that)
#   The Star / AseanPlus   https://www.thestar.com.my/rss/editors-pick -> 404
#       (all /rss/* paths tested return 404; replaced by NST + FMT below)

feeds:
  # ---- Brunei ----
  # Google News is the workhorse: it is served from Google's infrastructure, so
  # unlike borneobulletin.com.bn it does NOT 403 GitHub's datacenter IPs, and it
  # aggregates current Brunei coverage from many outlets. build.py credits the
  # real publisher (from entry.source) rather than "Google News", but note the
  # item links are Google redirect URLs that bounce to the original article.
  - name: Google News (Brunei)
    beat: brunei
    url: https://news.google.com/rss/search?q=Brunei&hl=en-US&gl=US&ceid=US:en
  # The Bruneian: a Brunei outlet with direct links and full article text. Carries
  # some PR/advertorial filler, but Gemini's selection skips the weak items.
  - name: The Bruneian
    beat: brunei
    url: https://thebruneian.news/feed/
  # Borneo Bulletin: genuine Brunei journalism with direct links, BUT it 403s from
  # GitHub's datacenter IPs (works locally). Kept because it succeeds on the runs
  # where it is not blocked; a 403 is skipped gracefully, never fatal.
  - name: Borneo Bulletin
    beat: brunei
    url: https://borneobulletin.com.bn/feed/
  - name: The Scoop
    beat: brunei
    url: https://thescoop.co/feed/           # low-frequency; may add nothing on quiet days

  # ---- Southeast Asia ----
  - name: Channel NewsAsia
    beat: sea
    url: https://www.channelnewsasia.com/api/v1/rss-outbound-feed
  - name: New Straits Times
    beat: sea
    url: https://www.nst.com.my/feed
  - name: Free Malaysia Today
    beat: sea
    url: https://www.freemalaysiatoday.com/feed/

  # ---- World ----
  - name: Al Jazeera
    beat: world
    url: https://www.aljazeera.com/xml/rss/all.xml

  # ---- Technology & Business ----
  - name: Ars Technica
    beat: tech
    url: https://feeds.arstechnica.com/arstechnica/index
